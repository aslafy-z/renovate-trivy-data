# Scans the repositories listed below; the generated preset, reports and SBOM
# archive go to the `data` branch of this repository.
name: renovate-trivy

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: renovate-trivy
  cancel-in-progress: false

permissions: {}

jobs:
  # Renovate, read-only, on a clone of each repository.
  lookup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: aslafy-z/renovate-trivy@main
        with:
          step: lookup
          repositories: |
            aslafy-z/renovate-trivy-demo
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: targets
          path: ${{ runner.temp }}/renovate-trivy
          retention-days: 1

  # Trivy, with nothing but read access to the data branch.
  scan:
    needs: lookup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: targets
          path: ${{ runner.temp }}/renovate-trivy
      - uses: aslafy-z/renovate-trivy@main
        with:
          step: scan
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: delta
          path: ${{ runner.temp }}/renovate-trivy/delta
          include-hidden-files: true
          retention-days: 1

  # git only; the one job that can write, and only to this repository.
  publish:
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: delta
          path: ${{ runner.temp }}/renovate-trivy/delta
      - uses: aslafy-z/renovate-trivy@main
        with:
          step: publish
